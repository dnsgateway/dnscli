# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: dnscli

dist: bin
builds:
  # macOS needs cgo for the Keychain with Touch ID (internal/keychain).
  - id: darwin
    main: ./cmd/dnscli
    binary: dnscli
    env:
      # TODO: cgo temporarily disabled (falls back to keychain_other.go) until
      # darwin builds run on a macOS runner; set back to CGO_ENABLED=1 then.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0

  # Other platforms have no Keychain backend (keychain_other.go)
  - id: default
    main: ./cmd/dnscli
    binary: dnscli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0

snapshot:
  version_template: edge

changelog:
  disable: true

archives:
  - id: dnscli
    ids:
      - darwin
      - default
    name_template: "dnscli_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - formats:
          - zip
        goos: windows
    files:
      - LICENSE

homebrew_casks:
  - name: dnscli
    description: DNS CLI is a command-line interface for managing DNS records
    homepage: "https://github.com/dnsgateway/{{ .ProjectName }}"
    license: "MPL-2.0"

    directory: Casks
    commit_author:
      name: dnsgateway
      email: dnsgateway@dnsgate.link
    repository:
      owner: dnsgateway
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TOKEN }}"

    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dnscli"]
          end

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - artifacts: checksum
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true
