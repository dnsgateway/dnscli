# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: dnscli

dist: bin
builds:
  - id: default
    main: ./cmd/dnscli
    binary: dnscli
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0

snapshot:
  version_template: edge

changelog:
  disable: true

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: dnscli
    description: DNS CLI is a command-line interface for managing DNS records
    homepage: "https://github.com/sergelogvinov/{{ .ProjectName }}"
    license: Apache-2.0

    directory: Casks
    commit_author:
      name: sergelogvinov
      email: 5407715+sergelogvinov@users.noreply.github.com
    repository:
      owner: sergelogvinov
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TOKEN }}"

    # Bug in goreleaser v2.17.1?: target is bin/dnscli,
    # but it should be dnscli, so we need to override it in custom_block
    custom_block: |
      arch arm: "arm64", intel: "amd64"

    # Bug?
    # need set full name of binary in postflight - dnscli_darwin_#{arch}
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dnscli_darwin_#{arch}"]
          end

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - artifacts: checksum
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true
